spring.application.name=pedidos

spring.datasource.url=jdbc:postgresql://ms-db:5432/ms
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Como nós já estamos criando a tabela no init.sql, mandamos o Hibernate só "validar" ou "atualizar", sem apagar nada
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# 1. Ativa a protecao no Feign
spring.cloud.openfeign.circuitbreaker.enabled=true

# 2. Configuracoes da chave do disjuntor ('estoque')
# Avalia as ultimas 5 requisicoes
resilience4j.circuitbreaker.instances.estoque.sliding-window-size=5

# Desarma se 50 porcento ou mais falharem (ou seja, 3 erros nas ultimas 5 tentativas)
resilience4j.circuitbreaker.instances.estoque.failure-rate-threshold=50

# Tempo que ele fica desarmado (esperando o servico voltar) antes de testar de novo: 10 segundos
resilience4j.circuitbreaker.instances.estoque.wait-duration-in-open-state=10000ms


# --- CONFIGURACOES DO RABBITMQ ---
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest